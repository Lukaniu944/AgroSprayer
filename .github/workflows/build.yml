name: AgroSprayer checks
on:
  push:
    branches: [auto-regulator-bez-przeplywomierza, safety-interlocks-pressure-valve]
  pull_request:
  workflow_dispatch:

jobs:
  pressure-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C++17 regulator and sensor tests (no ESP32 hardware)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/test_pressure_control.cpp -o /tmp/agrosprayer-pressure-test
          /tmp/agrosprayer-pressure-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -IAgroSprayer tests/test_pressure_sensor.cpp -o /tmp/agrosprayer-pressure-sensor-test
          /tmp/agrosprayer-pressure-sensor-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -IAgroSprayer tests/test_nozzle_profile_compatibility.cpp -o /tmp/agrosprayer-nozzle-profile-test
          /tmp/agrosprayer-nozzle-profile-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -IAgroSprayer tests/test_nozzle_flow.cpp -o /tmp/agrosprayer-nozzle-flow-test
          /tmp/agrosprayer-nozzle-flow-test
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -IAgroSprayer tests/test_aog_pgn.cpp -o /tmp/agrosprayer-aog-pgn-test
          /tmp/agrosprayer-aog-pgn-test

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 core and LVGL
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install lvgl@9.6.0
      - name: Compile Arduino (with built-in LVGL config)
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=huge_app' \
            --build-property 'compiler.cpp.extra_flags=-DLV_CONF_SKIP -DLV_FONT_MONTSERRAT_16=1 -DLV_FONT_MONTSERRAT_20=1 -DLV_FONT_MONTSERRAT_24=1 -DLV_FONT_MONTSERRAT_28=1' \
            --build-property 'compiler.c.extra_flags=-DLV_CONF_SKIP -DLV_FONT_MONTSERRAT_16=1 -DLV_FONT_MONTSERRAT_20=1 -DLV_FONT_MONTSERRAT_24=1 -DLV_FONT_MONTSERRAT_28=1' \
            --warnings all --output-dir dist AgroSprayer
      - name: Save firmware binary for bench testing
        uses: actions/upload-artifact@v4
        with:
          name: AgroSprayer-ESP32S3-BENCH-ONLY
          path: dist/*.bin
          if-no-files-found: error
